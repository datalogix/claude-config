version: 2

updates:
  - package-ecosystem: github-actions
    directories:
      - /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - '*'
    commit-message:
      prefix: ci

  - package-ecosystem: npm
    directories:
      - /
    schedule:
      interval: monthly
    groups:
      npm:
        patterns:
          - '*'
    ignore:
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
    commit-message:
      prefix: chore
